apiVersion: v1
kind: ConfigMap
metadata:
  name: payments-page
  namespace: dev
data:
  index.html: |
    <!doctype html>
    <html><head><title>Payments</title></head>
    <body><h1>payments service</h1><p>Harness GitOps DEV demo is running.</p></body></html>
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: payments
  namespace: dev
  labels:
    app: payments
    app.kubernetes.io/part-of: multi-service-demo
spec:
  replicas: 1
  selector:
    matchLabels:
      app: payments
  template:
    metadata:
      labels:
        app: payments
        app.kubernetes.io/part-of: multi-service-demo
    spec:
      containers:
        - name: nginx
          image: nginx:1.28-alpine
          ports:
            - name: http
              containerPort: 80
          resources:
            requests:
              cpu: 25m
              memory: 32Mi
            limits:
              cpu: 100m
              memory: 64Mi
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 2
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
          volumeMounts:
            - name: page
              mountPath: /usr/share/nginx/html/index.html
              subPath: index.html
              readOnly: true
      volumes:
        - name: page
          configMap:
            name: payments-page
---
apiVersion: v1
kind: Service
metadata:
  name: payments
  namespace: dev
  labels:
    app: payments
spec:
  type: ClusterIP
  selector:
    app: payments
  ports:
    - name: http
      port: 80
      targetPort: http

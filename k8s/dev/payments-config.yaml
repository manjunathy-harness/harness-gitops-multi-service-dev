apiVersion: v1
kind: ConfigMap
metadata:
  name: payments-page
  namespace: dev
data:
  index.html: |
    <!doctype html>
    <html><head><title>Payments</title></head>
    <body><h1>payments service</h1><p>Harness GitOps DEV demo is running.</p></body></html>
---
apiVersion: v1
kind: Service
metadata:
  name: payments
  namespace: dev
  labels:
    app: payments
spec:
  type: ClusterIP
  selector:
    app: payments
  ports:
    - name: http
      port: 80
      targetPort: http

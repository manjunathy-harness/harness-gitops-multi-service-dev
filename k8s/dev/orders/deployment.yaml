metadata:
  name: "orders"
  namespace: "dev"
  labels:
    app: "orders"
    app.kubernetes.io/part-of: "multi-service-demo"
apiVersion: "apps/v1"
kind: "Deployment"
spec:
  template:
    metadata:
      labels:
        app: "orders"
        app.kubernetes.io/part-of: "multi-service-demo"
    spec:
      containers:
      - image: "docker.io/pes2ug19cs219/fme-demo:1.1.0"
        livenessProbe:
          periodSeconds: 10
          initialDelaySeconds: 10
          httpGet:
            path: "/api/status"
            port: "http"
        name: "fme-demo"
        readinessProbe:
          periodSeconds: 5
          initialDelaySeconds: 3
          httpGet:
            path: "/api/status"
            port: "http"
        resources:
          requests:
            memory: "128Mi"
            cpu: "50m"
          limits:
            memory: "256Mi"
            cpu: "500m"
        ports:
        - name: "http"
          containerPort: 3000
        env:
        - name: "PORT"
          value: "3000"
        - name: "FME_LOCALHOST"
          value: "1"
  selector:
    matchLabels:
      app: "orders"
  replicas: 1

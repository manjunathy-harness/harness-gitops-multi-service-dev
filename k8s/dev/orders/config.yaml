apiVersion: v1
kind: ConfigMap
metadata:
  name: orders-page
  namespace: dev
data:
  index.html: |
    <!doctype html>
    <html><head><title>Orders</title></head>
    <body><h1>orders service</h1><p>Harness GitOps DEV demo is running.</p></body></html>
---
apiVersion: v1
kind: Service
metadata:
  name: orders
  namespace: dev
  labels:
    app: orders
spec:
  type: ClusterIP
  selector:
    app: orders
  ports:
    - name: http
      port: 80
      targetPort: http

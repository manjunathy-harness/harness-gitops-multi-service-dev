apiVersion: v1
kind: ConfigMap
metadata:
  name: billing-page
  namespace: dev
data:
  index.html: |
    <!doctype html>
    <html><head><title>Billing</title></head>
    <body><h1>billing service</h1><p>Harness GitOps DEV demo is running.</p></body></html>
---
apiVersion: v1
kind: Service
metadata:
  name: billing
  namespace: dev
  labels:
    app: billing
spec:
  type: ClusterIP
  selector:
    app: billing
  ports:
    - name: http
      port: 80
      targetPort: http
